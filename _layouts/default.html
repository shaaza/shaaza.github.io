<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #fffff8;
      color: #111;
      line-height: 1.6;
    }
    h1 {
      border-bottom: 2px solid #111;
      padding-bottom: 0.5rem;
    }
    h2 {
      margin-top: 2rem;
      color: #333;
    }
    h3 {
      margin-top: 1.5rem;
      color: #444;
    }
    a { color: #1a0dab; }
    a:visited { color: #609; }
    .meta {
      font-size: 0.85rem;
      color: #666;
    }
    .nav {
      font-size: 0.9rem;
      margin-bottom: 2rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #ccc;
    }
    .nav a {
      margin-right: 1rem;
    }
    ul.schedule {
      list-style: none;
      padding-left: 1rem;
    }
    ul.schedule li {
      margin: 0.4rem 0;
    }
    ul.schedule li::before {
      content: "\2192\00a0";
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1rem 0;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 0.5rem;
      text-align: left;
      font-size: 0.9rem;
    }
    th {
      background: #f0f0e8;
    }
    code {
      background: #f0f0e8;
      padding: 0.1rem 0.3rem;
      font-size: 0.9em;
    }
    pre {
      background: #f0f0e8;
      padding: 1rem;
      overflow-x: auto;
      font-size: 0.85em;
      line-height: 1.4;
    }
    pre code {
      background: none;
      padding: 0;
    }
    blockquote {
      border-left: 3px solid #999;
      margin-left: 0;
      padding-left: 1rem;
      color: #555;
      font-style: italic;
    }
    hr {
      border: none;
      border-top: 1px solid #ccc;
      margin: 2rem 0;
    }
    .breadcrumb {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 1rem;
    }
    .breadcrumb a {
      color: #666;
    }
    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid #ccc;
      font-size: 0.8rem;
      color: #999;
    }
  </style>
</head>
<body>

  <div class="nav">
    <a href="{{ '/' | relative_url }}">Schedule</a>
    <a href="{{ '/resources/' | relative_url }}">Resources</a>
    <a href="{{ '/students/' | relative_url }}">Students</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
  </div>

  {{ content }}

  <footer>
    Software Engineering in the AI Era
  </footer>

</body>
</html>
